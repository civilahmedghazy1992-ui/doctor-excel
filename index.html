<style>
:root{--bg:#f3f6f4;--surface:#fff;--ink:#132a22;--muted:#5a6d65;--line:#d8e2dd;--accent:#107c41;--accent-ink:#fff;--bad:#b3261e;--bad-bg:#fde7e5;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e1714;--surface:#15221d;--ink:#e4efe9;--muted:#9db3a9;--line:#26372f;--accent:#3fbf78;--accent-ink:#06210f;--bad:#ff8a80;--bad-bg:#3d1c1a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "IBM Plex Sans Arabic","Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;display:flex;align-items:center;justify-content:center;
 padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.box{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 20px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;gap:12px}
.top svg{width:44px;height:44px;flex:none;color:var(--accent)}
h1{margin:0;font:700 22px "Readex Pro","Segoe UI",sans-serif;direction:ltr;text-align:right}
.sub{margin:0;color:var(--muted);font-size:13px}
label{font-weight:600;font-size:14px}
input[type=password]{width:100%;padding:13px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif;direction:ltr}
input[type=password]:focus{outline:3px solid var(--accent);outline-offset:1px}
.rem{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted);font-weight:400}
.rem input{width:18px;height:18px;accent-color:var(--accent)}
button{appearance:none;border:0;border-radius:12px;min-height:48px;background:var(--accent);color:var(--accent-ink);font:600 16px "Readex Pro","Segoe UI",sans-serif;cursor:pointer}
button:disabled{opacity:.6}
.err{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:8px 12px;font-size:13.5px}
.foot{text-align:center;font-size:12px;color:var(--muted)}
[hidden]{display:none!important}
</style></head><body>

var K='de_key_'+P.salt.slice(0,10);
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function tob64(buf){var u=new Uint8Array(buf),s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
var err=document.getElementById('err'),go=document.getElementById('go');
function show(t){err.textContent=t;err.hidden=!t}
if(!(window.crypto&&crypto.subtle)){show('المتصفح ده مش بيدعم فك التشفير. افتح التطبيق من Chrome أو Safari.');go.disabled=true;return}
if('serviceWorker' in navigator && window.isSecureContext && location.protocol!=='file:'){navigator.serviceWorker.register('sw.js').catch(function(){})}
function derive(pw){return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']).then(function(base){
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt'])})}
function openWith(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct)).then(function(pt){
  var html=new TextDecoder().decode(pt);
  window.DE_LOCK=function(){try{localStorage.removeItem(K)}catch(e){}location.reload()};
  document.open();document.write(html);document.close();})}
try{var saved=localStorage.getItem(K);
  if(saved){crypto.subtle.importKey('raw',b64(saved),'AES-GCM',true,['decrypt']).then(openWith).catch(function(){try{localStorage.removeItem(K)}catch(e){}})}}catch(e){}

  var pw=document.getElementById('pw').value,rm=document.getElementById('rm').checked,key;
  derive(pw).then(function(k){key=k;return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},k,b64(P.ct))}).then(function(){
